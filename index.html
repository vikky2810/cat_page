<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cat Corner</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card">
      <h1>🐱 Cat Corner</h1>
      <p class="subtitle">A tiny webpage dedicated to our favorite furry friends.</p>

      <section class="cat-fact-box">
        <h2>Cat Fact of the Moment</h2>
        <p id="cat-fact">Click the button for a cat fact!</p>
        <button id="fact-btn" type="button">Show me a cat fact</button>
      </section>

      <section class="cat-traits">
        <h2>Why cats are awesome</h2>
        <ul>
          <li>They are curious and playful.</li>
          <li>They can be independent and affectionate.</li>
          <li>Their purr can be super calming.</li>
        </ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
